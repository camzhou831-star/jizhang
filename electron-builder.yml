appId: com.camzhou.jizhang
productName: 简账
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  executableName: jizhang
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 简账
  artifactName: jizhang-setup-${version}.${ext}
portable:
  artifactName: jizhang-portable-${version}.${ext}
mac:
  icon: resources/icon.png
  target: [dmg]
  artifactName: jizhang-${version}-${arch}.${ext}
npmRebuild: false
